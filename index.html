  <style>
    :root {
      --ink: #11140F;
      --muted: #5E685F;
      --green: #6EA82E;
      --green-deep: #315B18;
      --mint: #E9F7DA;
      --paper: #FBFCF7;
      --white: #FFFFFF;
      --line: rgba(17, 20, 15, 0.12);
      --shadow-1: 0 1px 2px rgba(38, 50, 33, 0.06), 0 8px 24px rgba(38, 50, 33, 0.07);
      --shadow-2: 0 2px 6px rgba(38, 50, 33, 0.08), 0 28px 70px rgba(38, 50, 33, 0.16);
      --radius: 10px;
      --gutter: clamp(16px, 4vw, 32px);
      --section: clamp(56px, 9vw, 112px);
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (min-height: 520px) {
      html { scroll-snap-type: y mandatory; }
      html:has(form:focus-within) { scroll-snap-type: none; }
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      font-weight: 500;
      font-size: 17px;
      line-height: 1.7;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: inherit; }
    h1, h2, h3 {
      margin: 0;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.04;
      overflow-wrap: break-word;
    }
    h1 { font-size: clamp(2rem, min(11.5vw, 11svh), 7rem); }
    h2 { font-size: clamp(2rem, 4.6vw, 3.25rem); }
    h3 { font-size: 1.25rem; letter-spacing: -0.02em; line-height: 1.2; }
    p { margin: 0; }

    .shell { width: min(1160px, 100% - var(--gutter) * 2); margin-inline: auto; }
    .panel {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      justify-content: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--white);
      font: inherit;
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      transition-property: transform, background-color;
      transition-duration: 180ms;
      transition-timing-function: var(--ease);
    }
    .btn:hover { background: #26301F; transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(.985); }
    .btn:disabled { cursor: wait; opacity: .7; transform: none; }
    :focus-visible { outline: 3px solid rgba(110, 168, 46, 0.75); outline-offset: 3px; border-radius: 4px; }

    /* Header */
    .header-row { position: absolute; top: 0; left: 50%; z-index: 5; display: flex; min-height: 88px; align-items: center; transform: translateX(-50%); }
    .wordmark {
      font-family: "Instrument Sans", "Space Grotesk", sans-serif;
      font-weight: 500;
      font-size: 1.3125rem;
      line-height: 1;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .wordmark span { display: block; }

    /* Floating controls */
    .next, .call-float {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 30;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition-property: transform, opacity, background-color;
      transition-duration: 180ms;
      transition-timing-function: var(--ease);
    }
    .next {
      right: 0;
      left: 0;
      width: fit-content;
      min-height: 52px;
      gap: 8px;
      margin-inline: auto;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      box-shadow: var(--shadow-2);
      font-weight: 800;
      line-height: 1.2;
      text-decoration: none;
    }
    .next:hover { background: var(--mint); transform: translateY(-2px); }
    .next:active { transform: translateY(0) scale(.985); }
    .next svg { width: 18px; height: 18px; animation: bob 1.8s var(--ease) infinite; }
    .next.gone { opacity: 0; pointer-events: none; transform: translateY(12px); }
    @media (max-width: 380px) { .next { right: calc(var(--gutter) + 60px); left: var(--gutter); } }
    @keyframes bob { 50% { transform: translateY(3px); } }
    .call-float {
      right: var(--gutter);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--white);
      box-shadow: var(--shadow-2);
    }
    .call-float:hover { background: #26301F; transform: translateY(-2px); }
    .call-float:active { transform: translateY(0) scale(.96); }
    .call-float svg { width: 22px; height: 22px; }

    /* Hero and price */
    .swap {
      display: block;
      width: fit-content;
      color: #315B18;
      transition-property: transform, opacity;
      transition-duration: 240ms;
      transition-timing-function: var(--ease);
    }
    .swap.out { opacity: 0; transform: translateY(0.12em); }
    .no-lock { margin-top: calc(clamp(24px, 5svh, 64px) * -0.5); font-size: 1.25rem; font-weight: 800; }
    .hero { padding-block: clamp(24px, 5vw, 64px) var(--section); }
    .hero { padding-block: 88px 92px; }
    .price { display: flex; flex-wrap: wrap; gap: 16px clamp(40px, 8vw, 96px); margin: clamp(24px, 5svh, 64px) 0; }
    .price div { min-width: 0; }
    .price dt { color: var(--muted); font-weight: 800; }
    .price dd { margin: 0; font-family: "Space Grotesk", sans-serif; font-size: clamp(3rem, min(7vw, 9svh), 4.5rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }

    /* Previous work carousel */
    .work { padding-block: 32px 92px; background: var(--white); }
    .stage {
      width: min(100%, max(320px, calc((100svh - 400px) * 1.6)));
      margin-inline: auto;
      transition-property: transform, opacity;
      transition-duration: 460ms;
      transition-timing-function: var(--ease);
    }
    .stage.pre { opacity: 0; transform: translateY(28px) scale(.92); }
    .track {
      display: flex;
      gap: 32px;
      margin: 8px -16px 0;
      padding: 12px 16px 24px;
      overflow-x: auto;
      scroll-padding-inline: 16px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .track::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--white);
      box-shadow: var(--shadow-1);
      scroll-snap-align: center;
      text-decoration: none;
    }
    .slide img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-bottom: 1px solid var(--line); }
    .slide h3 { padding: 14px 20px 16px; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .arrow {
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      transition-property: transform, background-color;
      transition-duration: 180ms;
      transition-timing-function: var(--ease);
    }
    .arrow:hover { background: var(--mint); transform: translateY(-2px); }
    .arrow:active { transform: translateY(0) scale(.96); }
    .arrow svg { width: 18px; height: 18px; }
    .dots { display: flex; }
    .dot { display: grid; width: 24px; height: 44px; padding: 0; place-items: center; border: 0; background: none; cursor: pointer; }
    .dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); opacity: .22; transition: opacity 180ms var(--ease); }
    .dot:hover::before { opacity: .5; }
    .dot[aria-current="true"]::before { opacity: 1; }

    /* Contact */
    .end { justify-content: flex-start; }
    .contact { display: flex; flex: 1; align-items: center; padding-block: 32px; }
    .contact-grid { display: grid; gap: clamp(32px, 6vw, 72px); align-items: start; }
    .contact-grid > * { min-width: 0; }
    .contact-lines { display: grid; gap: 6px; margin-top: 20px; font-size: 1.25rem; font-weight: 800; }
    .contact-lines a { width: fit-content; text-underline-offset: 4px; overflow-wrap: anywhere; transition: color 160ms var(--ease); }
    .contact-lines a:hover { color: var(--green-deep); }
    form { display: grid; gap: 16px; padding: clamp(22px, 4vw, 34px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); box-shadow: var(--shadow-1); }
    label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 800; }
    input[type="text"], input[type="tel"] {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid rgba(17, 20, 15, 0.22);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }
    input:focus { border-color: var(--green); }
    .form-status { font-size: 0.9375rem; font-weight: 800; }
    .form-status:empty { display: none; }
    .form-status[data-state="success"] { color: var(--green-deep); }
    .form-status[data-state="error"] { color: #A33A1F; }
    .hidden-frame { display: none; }

    /* Footer */
    .footer { padding-block: 24px 84px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }
    .footer-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
    .footer a { text-underline-offset: 3px; }

    @media (min-width: 900px) {
      .contact-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .btn, .next, .call-float, .arrow, .stage, .contact-lines a, .swap { transition: none; }
      .next svg { animation: none; }
    }
  </style>
</head>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Headline: rotate the word and its colour.
    const swap = document.getElementById('swap');
    const swapWords = [
      ['business', '#315B18'],
      ['club', '#B4431F'],
      ['school', '#1F5C85'],
      ['shop', '#7A3B8F'],
      ['charity', '#A0600A'],
      ['café', '#315B18'],
      ['organisation', '#B4431F'],
      ['salon', '#1F5C85'],
      ['gym', '#7A3B8F'],
      ['restaurant', '#A0600A'],
      ['team', '#315B18'],
      ['clinic', '#B4431F'],
      ['church', '#1F5C85'],
      ['community', '#7A3B8F']
    ];
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      let swapIndex = 0;
      window.setInterval(() => {
        swap.classList.add('out');
        window.setTimeout(() => {
          swapIndex = (swapIndex + 1) % swapWords.length;
          swap.textContent = `${swapWords[swapIndex][0]}.`;
          swap.style.color = swapWords[swapIndex][1];
          swap.classList.remove('out');
        }, 240);
      }, 2000);
    }

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Floating prompt: points at the next panel, and hides on the last one.
    const next = document.getElementById('next');
    const nextLabel = document.getElementById('nextLabel');
    const nextByPanel = {
      top: ['#work', 'Previous work'],
      work: ['#contact', 'Contact']
    };
    const hero = document.querySelector('.hero');
    const panelObserver = new IntersectionObserver((entries) => {
      entries.filter((entry) => entry.isIntersecting).forEach((entry) => {
        const target = nextByPanel[entry.target === hero ? 'top' : entry.target.id];
        next.classList.toggle('gone', !target);
        next.inert = !target;
        if (target) {
          next.href = target[0];
          nextLabel.textContent = target[1];
        }
      });
    }, { rootMargin: '-50% 0px -50% 0px' });
    [hero, document.getElementById('work'), document.getElementById('end')].forEach((panel) => panelObserver.observe(panel));

    // Mouse wheel and trackpad: one movement jumps one panel.
    const panels = [hero, document.getElementById('work'), document.getElementById('end')];
    const snapQuery = window.matchMedia('(min-height: 520px)');
    let wheelLocked = false;
    let wheelJumpAt = 0;
    let wheelTimer = null;
    window.addEventListener('wheel', (event) => {
      if (!snapQuery.matches || event.ctrlKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
      if (document.querySelector('form:focus-within')) return;
      const last = panels[panels.length - 1];
      const insideTallLast = last.offsetHeight > window.innerHeight + 2 && window.scrollY >= last.offsetTop - 2;
      if (insideTallLast && !(event.deltaY < 0 && window.scrollY <= last.offsetTop + 2)) return;

      event.preventDefault();
      window.clearTimeout(wheelTimer);
      wheelTimer = window.setTimeout(() => { wheelLocked = false; }, Math.max(160, wheelJumpAt + 700 - Date.now()));
      if (wheelLocked || event.deltaY === 0) return;

      const current = panels.reduce((found, panel, index) => (panel.offsetTop <= window.scrollY + 2 ? index : found), 0);
      const target = panels[current + Math.sign(event.deltaY)];
      if (!target) return;
      wheelLocked = true;
      wheelJumpAt = Date.now();
      window.scrollTo({ top: target.offsetTop });
    }, { passive: false });

    // Carousel pops up each time the panel comes into view.
    const stage = document.getElementById('stage');
    if (!reduceMotion) {
      stage.classList.add('pre');
      new IntersectionObserver(([entry]) => {
        stage.classList.toggle('pre', !entry.isIntersecting);
      }, { threshold: 0.2 }).observe(document.getElementById('work'));
    }

    // Carousel controls.
    const track = document.getElementById('track');
    const slides = [...track.children];
    const dotsBox = document.getElementById('dots');
    const slideStep = () => slides[1].offsetLeft - slides[0].offsetLeft;
    const currentSlide = () => Math.round(track.scrollLeft / slideStep());
    const goToSlide = (index) => {
      const wrapped = (index + slides.length) % slides.length;
      track.scrollTo({ left: wrapped * slideStep(), behavior: reduceMotion ? 'auto' : 'smooth' });
    };
    const dots = slides.map((slide, index) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot';
      dot.setAttribute('aria-label', `Show ${slide.querySelector('h3').textContent}`);
      dot.addEventListener('click', () => goToSlide(index));
      dotsBox.append(dot);
      return dot;
    });
    const updateDots = () => {
      const active = currentSlide();
      dots.forEach((dot, index) => dot.setAttribute('aria-current', index === active ? 'true' : 'false'));
    };
    document.getElementById('prev').addEventListener('click', () => goToSlide(currentSlide() - 1));
    document.getElementById('forward').addEventListener('click', () => goToSlide(currentSlide() + 1));
    track.addEventListener('scroll', updateDots, { passive: true });
    updateDots();

    // Track taps on phone links so calls show up in analytics.
    document.querySelectorAll('[data-track]').forEach((link) => {
      link.addEventListener('click', () => {
        if (typeof gtag === 'function') gtag('event', 'phone_click', { event_label: link.dataset.track });
      });
    });

    // Lead form: posts to the Google Apps Script endpoint in lead-config.js.
    const config = window.HTS_LEAD_CONFIG || {};
    const endpoint = config.endpoint || '';
    const usesRemoteEndpoint = /^https:\/\/script\.google\.com\/macros\/s\//.test(endpoint);
    const form = document.getElementById('leadForm');
    const button = document.getElementById('leadSubmitButton');
    const frame = document.getElementById('leadSubmitFrame');
    const status = document.getElementById('formStatus');
    const buttonLabel = button.textContent;
    const errorMessage = 'That did not go through. Please call or text Jesse on 0410 640 220.';
    let pending = false;
    let timeoutId = null;
    let frameLoadCounts = false;

    if (endpoint) form.action = endpoint;

    const setStatus = (state, message) => {
      status.dataset.state = state;
      status.textContent = message;
    };

    const setPending = (value) => {
      pending = value;
      button.disabled = value;
      button.textContent = value ? 'Sending...' : buttonLabel;
    };

    const fillTracking = () => {
      const params = new URLSearchParams(window.location.search);
      const values = {
        submittedAt: new Date().toISOString(),
        pageUrl: window.location.href,
        referrer: document.referrer || '',
        utmSource: params.get('utm_source') || '',
        utmMedium: params.get('utm_medium') || '',
        utmCampaign: params.get('utm_campaign') || '',
        utmContent: params.get('utm_content') || '',
        utmTerm: params.get('utm_term') || '',
        fbclid: params.get('fbclid') || '',
        gclid: params.get('gclid') || '',
        leadId: `hts-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
      };
      Object.entries(values).forEach(([id, value]) => { document.getElementById(id).value = value; });
    };

    const finishSuccess = () => {
      if (!pending) return;
      window.clearTimeout(timeoutId);
      frameLoadCounts = false;
      setPending(false);
      form.reset();
      setStatus('success', "Thanks. I've got your details and I'll be in touch soon.");
      if (typeof gtag === 'function') gtag('event', 'generate_lead', { event_category: 'lead_form', value: 1 });
    };

    const finishError = () => {
      if (!pending) return;
      window.clearTimeout(timeoutId);
      frameLoadCounts = false;
      setPending(false);
      setStatus('error', errorMessage);
    };

    frame.addEventListener('load', () => {
      if (!pending || !frameLoadCounts) return;
      window.setTimeout(() => { if (pending && frameLoadCounts) finishSuccess(); }, 240);
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.source !== 'hts-lead-capture' || !pending) return;
      if (data.status === 'success') finishSuccess(); else finishError();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!endpoint) { setStatus('error', errorMessage); return; }
      fillTracking();
      frameLoadCounts = usesRemoteEndpoint;
      setPending(true);
      setStatus('pending', 'Sending your details...');
      timeoutId = window.setTimeout(finishError, usesRemoteEndpoint ? 20000 : 12000);
      HTMLFormElement.prototype.submit.call(form);
    });
  </script>
</body>
</html>
